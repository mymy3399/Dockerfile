# NestJS API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: government-asset-management
  labels:
    app: api
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: backend
    spec:
      containers:
      - name: api
        image: ghcr.io/mymy3399/government-asset-api:latest
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: PORT
          value: "4000"
        - name: RBAC_ENABLED
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RBAC_ENABLED
        - name: AUDIT_ENABLED
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AUDIT_ENABLED
        # External secrets (Vault integration examples):
        # - name: DATABASE_URL
        #   valueFrom:
        #     secretKeyRef:
        #       name: vault-secrets
        #       key: DATABASE_URL
        # - name: AUTH_SECRET
        #   valueFrom:
        #     secretKeyRef:
        #       name: vault-secrets
        #       key: AUTH_SECRET
        # - name: REDIS_URL
        #   valueFrom:
        #     secretKeyRef:
        #       name: vault-secrets
        #       key: REDIS_URL
        # Temporary values for demo (replace with secrets):
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres123@postgres-service:5432/government_asset_db"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: AUTH_SECRET
          value: "your-super-secret-key" # TODO: Replace with Vault reference
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: government-asset-management
  labels:
    app: api
    component: backend
spec:
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: api
  type: ClusterIP